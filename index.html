<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Bloom ♡</title><meta name="theme-color" content="#f8d9e6"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6fa;color:#80415f;font-family:system-ui,sans-serif}.app{max-width:520px;margin:auto;padding:18px 15px 50px}header{background:#f9d9e6;border-radius:22px;padding:24px;margin-bottom:16px}header small{letter-spacing:2px}h1{margin:7px 0;font-size:30px}h2{font-size:17px;margin:0 0 14px}.panel{background:white;border:1px solid #f5dce6;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #e8b5c522}.muted{color:#a66b87;font-size:13px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.percent{font-size:32px;font-weight:800;color:#d36d99}.track{height:12px;background:#fce7ef;border-radius:30px;overflow:hidden;margin:15px 0}.fill{height:100%;width:0;background:#e781aa;transition:width .2s}.subjects,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{cursor:pointer;border:1px solid #eeb9cf;background:#fff7fa;color:#934769;border-radius:12px;padding:10px;font:inherit}button.active,.primary{background:#df83aa;color:white;border-color:#df83aa}.subjects button{flex:1 1 28%;font-size:13px}input{width:100%;padding:13px;border:1px solid #eeb9cf;border-radius:12px;font:inherit;min-width:0;color:#80415f;background:white}.primary{width:100%;margin-top:10px;font-weight:700}.task{border:1px solid #f5dce6;border-radius:13px;padding:12px;margin:9px 0}.task label{display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}.task input{width:20px;height:20px;accent-color:#dc7ea6;flex:none}.task.done .content{text-decoration:line-through;color:#b9a0ad}.tag{font-size:12px;color:#a66b87}.delete{padding:3px 8px;border:0;background:transparent;color:#ae718c}.empty{text-align:center;padding:25px;color:#a66b87;background:#fff7fa;border-radius:14px}footer{text-align:center;color:#c7799a;font-size:13px;padding:12px}</style></head>
<body><main class="app"><header><small>MY LITTLE STUDY DIARY ♡</small><h1>Study Bloom 🌷</h1><div>今日の小さな頑張りを、花束にしよう。</div></header>
<section class="panel"><div class="between"><strong>📅 勉強する日</strong><input id="date" aria-label="勉強する日" type="date" style="width:auto;max-width:60%"></div><hr style="border:0;border-top:1px solid #f5dce6;margin:16px 0"><div class="between"><div><div class="muted">TODAY'S PROGRESS</div><div class="percent" id="percent">0%</div><div class="muted" id="count">0 / 0 個 完了</div></div><div style="font-size:46px">💗</div></div><div class="track"><div class="fill" id="fill"></div></div><div class="muted" id="message">今日の予定を登録してみよう！</div></section>
<section class="panel"><h2>＋ 新しい予定を追加</h2><div class="muted">① 教科を選ぶ</div><div class="subjects" id="subjects"></div><form id="form"><label class="muted" for="entry">② やることを入力</label><input id="entry" maxlength="160" required placeholder="例：数学ワーク P.20〜25"><button class="primary" type="submit">＋ この予定を登録する ♡</button></form></section>
<section class="panel"><div class="between"><h2>♡ My To Do List</h2><span class="muted" id="total">0 TASKS</span></div><div class="filters" id="filters"></div><div id="tasks"></div></section><footer>Small steps, big dreams. ♡</footer></main>
<script>
const names=['国語','数学','英語','理科','社会'], icons=['📕','📐','🔤','🧪','🌏'], key='study-bloom-v1';
let records=[];try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))records=saved}catch(e){}
let selected='国語',filter='すべて';const $=id=>document.getElementById(id);
const localDate=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
$('date').value=localDate();
function save(){try{localStorage.setItem(key,JSON.stringify(records))}catch(e){alert('保存できませんでした。ブラウザの保存設定を確認してね。')}}
function button(label,active,click){let b=document.createElement('button');b.type='button';b.textContent=label;if(active)b.className='active';b.onclick=click;return b}
function render(){const day=$('date').value,all=records.filter(x=>x.date===day),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;
$('percent').textContent=p+'%';$('count').textContent=done+' / '+all.length+' 個 完了';$('fill').style.width=p+'%';$('message').textContent=all.length&&p===100?'PERFECT！全部達成！おつかれさま 🎉':all.length?'一つずつ、コツコツ進めよう 🌷':'今日の予定を登録してみよう！';$('total').textContent=all.length+' TASKS';
$('subjects').replaceChildren(...names.map((n,i)=>button(icons[i]+' '+n,selected===n,()=>{selected=n;render()})));
$('filters').replaceChildren(...['すべて',...names].map(n=>button(n,filter===n,()=>{filter=n;render()})));
const list=$('tasks');list.replaceChildren();const visible=all.filter(x=>filter==='すべて'||x.subject===filter);
if(!visible.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='🌷 まだ予定がないよ';list.append(empty)}
visible.forEach(x=>{let item=document.createElement('div');item.className='task'+(x.done?' done':'');let top=document.createElement('div');top.className='between';let tag=document.createElement('span');tag.className='tag';tag.textContent=icons[names.indexOf(x.subject)]+' '+x.subject+(x.done?' · 完了':'');let del=button('削除',false,()=>{if(confirm('この予定を削除する？')){records=records.filter(y=>y.id!==x.id);save();render()}});del.className='delete';top.append(tag,del);
let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=x.done;check.onchange=()=>{x.done=check.checked;save();render()};let content=document.createElement('span');content.className='content';content.textContent=x.content;label.append(check,content);item.append(top,label);list.append(item)})}
$('form').onsubmit=e=>{e.preventDefault();const content=$('entry').value.trim();if(!content)return;records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),date:$('date').value,subject:selected,content,done:false});save();$('entry').value='';filter='すべて';render()};
$('date').onchange=()=>{filter='すべて';render()};render();

if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
